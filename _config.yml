# Lightweight Jekyll career site. Legacy Academic Pages assets are archived in Git history.
locale: en-US
title: Jintao Li
name: Jintao Li
description: "Jintao Li | Forward-deployed cloud engineering, applied ML and supply chain systems."
url: https://li-jintao.github.io
baseurl: ""
repository: li-jintao/li-jintao.github.io
timezone: Asia/Singapore
encoding: utf-8
markdown: kramdown
highlighter: rouge

author:
  name: Jintao Li
  avatar: profile.png
  bio: "Data Science Manager and Digital Solution Unit Lead at Ocean Network Express."
  location: Singapore
  email: jintao-li@outlook.com
  linkedin: jintao-li-18088b135/
  googlescholar: https://scholar.google.com.hk/citations?hl=en&user=zlCBoJIAAAAJ&view_op=list_works&sortby=pubdate

social:
  type: Person
  name: Jintao Li
  links:
    - https://www.linkedin.com/in/jintao-li-18088b135/
    - https://github.com/li-jintao

include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - script
  - _config.dev.yml
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      image: /images/profile.png

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
