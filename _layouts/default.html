<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include masthead.html %}
  <div class="site-layout">
    <aside class="profile-sidebar" aria-label="Profile">
      <img class="profile-photo" src="{{ '/images/profile.png' | relative_url }}" width="160" height="160" alt="Portrait of Jintao Li">
      <h2>Jintao Li</h2>
      <p class="profile-role">Data Science Manager<br>Ocean Network Express</p>
      <p class="profile-location">Singapore</p>
      <p class="profile-summary">Forecasting · Optimization · Applied ML</p>
      <ul class="profile-links">
        <li><a href="mailto:{{ site.author.email }}">Email</a></li>
        <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">LinkedIn</a></li>
        <li><a href="https://github.com/li-jintao">GitHub</a></li>
        <li><a href="{{ site.author.googlescholar }}">Google Scholar</a></li>
      </ul>
    </aside>
    <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  </div>
  {% include footer.html %}
</body>
</html>
